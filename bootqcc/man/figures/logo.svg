<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="260" height="300" role="img" aria-label="bootqcc logo">
  <title>bootqcc</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#0f2238"/>
    </linearGradient>
    <clipPath id="hex">
      <polygon points="260,24 484,152 484,408 260,536 36,408 36,152"/>
    </clipPath>
  </defs>

  <!-- hexagon badge -->
  <polygon points="260,24 484,152 484,408 260,536 36,408 36,152" fill="url(#bg)" stroke="#5aa9e6" stroke-width="10" stroke-linejoin="round"/>

  <g clip-path="url(#hex)">
    <!-- bootstrap histogram (bell shape) -->
    <g fill="#5aa9e6" opacity="0.30">
      <rect x="92"  y="360" width="26" height="36"/>
      <rect x="118" y="336" width="26" height="60"/>
      <rect x="144" y="300" width="26" height="96"/>
      <rect x="170" y="254" width="26" height="142"/>
      <rect x="196" y="214" width="26" height="182"/>
      <rect x="222" y="190" width="26" height="206"/>
      <rect x="248" y="184" width="26" height="212"/>
      <rect x="274" y="196" width="26" height="200"/>
      <rect x="300" y="224" width="26" height="172"/>
      <rect x="326" y="266" width="26" height="130"/>
      <rect x="352" y="312" width="26" height="84"/>
      <rect x="378" y="346" width="26" height="50"/>
    </g>

    <!-- control limits -->
    <line x1="52" y1="168" x2="468" y2="168" stroke="#ff6b6b" stroke-width="6" stroke-dasharray="22 14" stroke-linecap="round"/>
    <line x1="52" y1="396" x2="468" y2="396" stroke="#ff6b6b" stroke-width="6" stroke-dasharray="22 14" stroke-linecap="round"/>
    <!-- centre line -->
    <line x1="52" y1="282" x2="468" y2="282" stroke="#cfe6fa" stroke-width="4" opacity="0.8"/>

    <!-- control chart path with one out-of-control point -->
    <polyline points="76,300 130,262 184,310 238,272 292,296 346,250 400,128 452,276"
              fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#ffffff">
      <circle cx="76"  cy="300" r="9"/>
      <circle cx="130" cy="262" r="9"/>
      <circle cx="184" cy="310" r="9"/>
      <circle cx="238" cy="272" r="9"/>
      <circle cx="292" cy="296" r="9"/>
      <circle cx="346" cy="250" r="9"/>
      <circle cx="452" cy="276" r="9"/>
    </g>
    <circle cx="400" cy="128" r="15" fill="#ff6b6b" stroke="#ffffff" stroke-width="5"/>
  </g>

  <!-- name -->
  <text x="260" y="468" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="1">bootqcc</text>
  <text x="260" y="560" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5aa9e6" letter-spacing="2" style="display:none">bootstrap control charts</text>
</svg>
